name: Ensure signing Python runtime
description: Install and verify the Python runtime and OTP primitives inside the signing container.
runs:
  using: composite
  steps:
    - name: Ensure signing Python runtime
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends python3
        fi
        python3 - <<'PY'
        import base64
        import hashlib
        import hmac
        import os
        import struct
        import sys
        import time
        from urllib.parse import parse_qs, urlparse

        if sys.version_info < (3, 10):
            raise SystemExit("Signing requires Python 3.10 or newer.")
        # RFC 6238's public SHA-1 vector verifies the OTP primitives without secrets.
        key = base64.b32decode("GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ")
        digest = hmac.new(key, struct.pack(">Q", 59 // 30), hashlib.sha1).digest()
        offset = digest[-1] & 0xF
        code = (int.from_bytes(digest[offset:offset + 4], "big") & 0x7FFFFFFF) % 100000000
        if code != 94287082:
            raise SystemExit("Signing Python OTP verification failed.")
        print(f"Signing Python: {sys.version.split()[0]} ({sys.executable}); OTP verification passed.")
        PY

